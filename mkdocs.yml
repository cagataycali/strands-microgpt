site_name: Strands MicroGPT
site_url: https://cagataycali.github.io/strands-microgpt
site_description: "Karpathy's pure-Python microGPT as a Strands Agents model provider — zero dependencies, pure autograd, trained from scratch."
repo_url: https://github.com/cagataycali/strands-microgpt
repo_name: cagataycali/strands-microgpt
extra_css:
- stylesheets/extra.css?v=1
nav:
- Home: index.md
- Getting Started:
  - Installation: getting-started/installation.md
  - Quickstart: getting-started/quickstart.md
- Guide:
  - Autograd Engine: guide/autograd.md
  - Training: guide/training.md
  - Custom Datasets: guide/custom-datasets.md
  - Tool Usage: guide/tool-usage.md
- Examples:
  - Overview: examples/overview.md
- Architecture: architecture.md
- API Reference: api-reference.md
theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      primary: white
      accent: deep-orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: deep-orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
  - navigation.sections
  - navigation.expand
  - navigation.indexes
  - toc.follow
  - content.code.copy
  - content.code.annotate
  - content.tabs.link
  - navigation.top
  - navigation.tracking
  - search.suggest
  - search.highlight
markdown_extensions:
- pymdownx.highlight:
    anchor_linenums: true
    line_spans: __span
    pygments_lang_class: true
- pymdownx.inlinehilite
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format ''
- pymdownx.tabbed:
    alternate_style: true
- admonition
- pymdownx.details
- pymdownx.betterem
- pymdownx.mark
- pymdownx.caret
- pymdownx.tilde
- pymdownx.keys
- pymdownx.tasklist:
    custom_checkbox: true
- pymdownx.emoji:
    emoji_index: !!python/name:material.extensions.emoji.twemoji ''
    emoji_generator: !!python/name:material.extensions.emoji.to_svg ''
- attr_list
- md_in_html
- tables
- def_list
- footnotes
- toc:
    permalink: true
plugins:
- search
